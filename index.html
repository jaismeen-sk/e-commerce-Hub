<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Full-Stack E-Commerce Hub</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background-color: #f4f4f4; display: flex; gap: 20px; }
        #store-container { flex: 3; }
        #wishlist-sidebar { flex: 1; background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); align-self: flex-start; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-top: 15px; }
        .card { background: #fff; border: 1px solid #ddd; padding: 15px; border-radius: 8px; text-align: center; display: flex; flex-direction: column; justify-content: space-between; }
        .card img { width: 100%; height: 120px; object-fit: contain; }
        button { background: #007bff; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        button.fav-btn { background: #ffc107; color: #222; }
        .wishlist-item { border-bottom: 1px solid #eee; padding: 10px 0; display: flex; justify-content: space-between; align-items: center; }
        .remove-btn { background: #dc3545; padding: 4px 8px; font-size: 12px; }
    </style>
</head>
<body>

    <!-- Main Store Panel -->
    <div id="store-container">
        <h1>🛍️ Developer Sprint Marketplace</h1>
        <button id="load-store-btn">Explore Live Products</button>
        <div id="product-grid" class="grid"></div>
    </div>

    <!-- Persistent Favorites Sidebar -->
    <div id="wishlist-sidebar">
        <h3>⭐ My Saved Wishlist</h3>
        <div id="wishlist-container"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
